<style>

 minmax(260px,1fr);gap:19px;margin-top:20px}.card{background:white;border:1px solid #dfe6dd;border-radius:15px;padding:22px;margin-bottom:14px}.head{display:flex;justify-content:space-between;gap:12px;align-items:start}.muted{color:#50655a}.btn{display:inline-block;border:1px solid #cbd9ce;border-radius:8px;background:white;color:#214435;padding:8px 12px;text-decoration:none;font-weight:650}.btn:hover{background:#edf4e9}.primary{background:#225840;border-color:#225840;color:white}.primary:hover{background:#174331}.hero .primary{background:#dbefad;border-color:#dbefad;color:#203a2c}.actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}.line{border-top:1px solid #e5ebe5;padding:12px 0}.line:last-child{padding-bottom:0}.bubble{max-width:90%;background:#edf3eb;padding:11px 15px;margin:9px 0;border-radius:11px;white-space:pre-wrap}.student{margin-left:auto;background:#daf0c5}.conversation{max-height:440px;overflow:auto}.form{display:grid;gap:8px}.form input{border:1px solid #bdcec1;border-radius:8px;padding:8px;width:100%}.form label{font-weight:650}.facts{display:grid;gap:10px}.facts div{border-top:1px solid #e4eae3;padding-top:10px}.notice{background:#f4ebd9;color:#624819;padding:10px;border-radius:8px;margin-bottom:12px}.stage{display:grid;grid-template-columns:92px 1fr;gap:10px;padding:10px 0;border-top:1px solid #e4eae3}.stage b{color:#375947}.check{margin-top:8px}.sub{margin-bottom:20px}.log{padding-left:20px}.log li{margin-bottom:8px}

@media(max-width:620px){aside{position:static;width:auto;padding:12px}.brand{padding:3px 5px 9px}nav{display:flex;overflow:auto}nav button{white-space:nowrap;padding:8px}.switch{padding:8px 5px 0;display:flex;gap:8px;align-items:center}.switch label{white-space:nowrap;margin:0}.switch select{width:auto}main{margin:0;padding:15px}.hero{padding:22px}.hero:after{display:none}.top{margin-bottom:15px}.card{padding:16px}}

</style></head><body>
<aside><div class="brand"><span>✦</span>College Mentor</div><nav id="nav" aria-label="Workspace"></nav><a class="workspace-link" href="local-ai.html">Open local AI mentor</a><div class="switch"><label for="persona">Demo student</label><select id="persona"><option value="alex">Alex · Grade 10</option><option value="maya">Maya · Grade 9</option></select></div></aside>
<main><div class="top"><strong>On-demand high school mentorship</strong><span class="badge">Interactive demo</span></div><div id="view"></div></main>
<script src="profile.js"></script>
<script>
const students={
 maya:{name:'Maya',grade:9,goal:'Explore illustration and visual communication',grades:'English A−, Algebra I B, Biology B+',activities:'Sketches from photos at home',hours:2,target:'',school:'Ask about Art II and Geometry prerequisites',budget:'Free materials',projects:[{title:'Reference sketches',detail:'Drew household objects from photographs. Enjoyed figuring out shadows.',result:'',kind:'sketches'}]},
 alex:{name:'Alex',grade:10,goal:'Explore computer science and environmental science',grades:'3.85 GPA, Precalculus A−, Chemistry B+',activities:'Robotics programmer',hours:3,target:'Stanford University',school:'Ask whether AP Statistics or Calculus fits junior year',budget:'Free public data',projects:[{title:'Weather dashboard',detail:'Used Python to display daily weather data.',result:'Built a working dashboard',kind:'weather'}]}
};
const $=id=>document.getElementById(id);
const safe=value=>String(value??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const storage='college-mentor-advising-v1';
const oldStorage='college-mentor-demo-v1';
const routes=['Mentor','My projects','College plan','My profile'];
const studioProfileFields={
 goal:'Careers and interests',
 grades:'Classes and grades',
 activities:'Extracurriculars and interests outside school',
 school:'Course options and questions for your counselor',
 hours:'Hours per week you can spend exploring',
 budget:'Budget and access',
 target:'Colleges you’re curious about',
};
const loadedProfiles=new Map();
let key='maya',page='Mentor',activeProject=null,data={},previous={};
try{data=JSON.parse(localStorage.getItem(storage))||{};previous=JSON.parse(localStorage.getItem(oldStorage))||{}}catch{}
function state(){
 if(data[key]?.profile)return data[key];
 const {projects,...profile}=students[key];
 const prior=previous[key];
 if(prior?.verified){
  for(const field of ['goal','hours','target'])if(prior.profile[field]&&prior.profile[field]!=='Undecided')profile[field]=prior.profile[field];
  profile.grades=prior.profile.academics||profile.grades;
  profile.budget=prior.profile.cost||profile.budget;
 }
 const work=structuredClone(projects);
 if(prior?.verified&&prior.profile.work&&prior.profile.work!==projects[0].detail)work.push({title:'Work from earlier profile',detail:prior.profile.work,result:'',kind:'custom'});
 return data[key]={projects:work,messages:[],pending:null,plan:null,history:[],status:'',...data[key],profile};
}
function save(){
 try{
  const records=Object.fromEntries(Object.entries(data).map(([id,record])=>{
   if(!loadedProfiles.has(id))return [id,record];
   const {profile,...rest}=record;
   return [id,rest];
  }));
  localStorage.setItem(storage,JSON.stringify(records));
 }catch{}
}
function studioProfile(){
 const id=key,s=state();
 return ProfileEntries.load(id,studioProfileFields,s.profile,grouped=>{
  const read=field=>(grouped[field]||[]).join('; ');
  const hours=(grouped.hours||[]).map(Number).filter(value=>value>0&&value<=40).at(-1);
  Object.assign(s.profile,{
   goal:read('goal')||'your interests', grades:read('grades')||'grades to be added',
   activities:read('activities')||'an activity you choose',
   school:read('school')||'Which courses fit my interests?',
   hours:hours||1, budget:read('budget')||'materials you already have', target:read('target')
  });
  loadedProfiles.set(id,true);
  save();
  if(key!==id)return;
  if(page==='My profile')$('profile-context').innerHTML=contextMarkup(s);
  else if(document.activeElement?.tagName!=='INPUT')render();
 });
}
function button(action,label,primary=false){return '<button type="button" class="btn '+(primary?'primary':'')+'" data-action="'+action+'">'+label+'</button>'}
function field(name,label,value,type='text'){return '<label for="'+name+'">'+label+'</label><input id="'+name+'" name="'+name+'" type="'+type+'" '+(type==='number'?'min="1" max="40"':'maxlength="180"')+' required value="'+safe(value)+'">'}
const questions={
 project:'What project should I try next?',
 courses:'What classes should I take next year?',
 career:'How can I tell which career fits me?',
 college:'Help me find colleges that fit.',
 plan:'Help me build my admissions plan.'
};
function advisingContext(s){
 const p=s.profile, latest=s.projects.at(-1), completed=[...s.projects].reverse().find(x=>x.result);
 return {p,latest,completed,anchor:completed||latest};
}
function projectOptions(s){
 const {p,anchor}=advisingContext(s);
 const art=/art|illustrat|design|draw|visual/i.test(p.goal);
 const water=/environment|water|computer|coding|data|engineer/i.test(p.goal);
 const short=Number(p.hours)<=2;
 const from=anchor.title+(anchor.result?' ('+anchor.result+')':'');
 if(art)return [
  {kind:'illustration',title:'Illustrated guide',detail:'Build on '+from+'. Choose a topic you care about, sketch '+(short?'one page':'three pages')+' that teach a beginner something, and ask one reader what they understood. Save your first draft and one revision.'},
  {kind:'design',title:'Redesign a confusing sign',detail:'Use what you learned in '+from+'. Find a confusing sign or instruction sheet and make '+(short?'one alternative':'two alternatives')+'. Ask someone which version is easier to follow and write down why.'}
 ];
 if(water)return [
  {kind:'watershed',title:'Rainfall and water quality',detail:'Use '+from+' as a starting point. Pick one stream and two public datasets. '+(short?'Make a sampling calendar before writing code.':'Align dates in a notebook and show gaps before comparing patterns.')+' Save a short methods note.'},
  {kind:'tool',title:'Build a tool someone can try',detail:'Extend '+from+' by helping a club member answer one question. Build a simple prototype, watch them use it, and revise one feature.'}
 ];
 return [
  {kind:'research',title:'Investigate a question in your field',detail:'Start from '+from+' and your goal of '+p.goal+'. Pick one question you can answer with materials you already have. Share a short explanation of your findings.'},
  {kind:'prototype',title:'Make something for one person',detail:'Use a skill from '+from+' to make a small prototype related to '+p.goal+'. Ask one person for feedback and record what you changed.'}
 ];
}
function draftPlan(s){
 const {p,anchor}=advisingContext(s);
 const next=s.projects.length>1?'Continue '+s.projects.at(-1).title:'Pick a project with your mentor';
 const stages=[
  {title:'This semester',items:[
   {title:'Plan next year’s courses',body:'Bring your current grades ('+p.grades+') and this question to your counselor: '+p.school+'. Write down one preferred schedule and one backup.'},
   {title:'Build evidence of what you enjoy',body:'Use '+p.activities+' and what you learned in '+anchor.title+' to explore '+p.goal+'. Your next step: '+next+'. Set aside up to '+p.hours+' hours a week.'}
  ]},
  {title:p.grade<11?'Before junior year ends':'Before applications open',items:[
   {title:'Compare programs and costs',body:(p.target?'Start with '+p.target+'. ':'Choose three possible colleges. ')+'Compare courses you’d actually take, campus setting, and net price. Check each school’s official admissions and program pages for your entry year.'},
   {title:'Gather examples of growth',body:'Keep one example of your work, feedback you received, and what you changed. Add coursework and activities you want to discuss with your counselor.'}
  ]},
  {title:'Senior year · application season',items:[
   {title:'Confirm deadlines and application materials',body:'For each college, check the official deadline, testing policy and materials. Plan time for essays, recommendations, transcripts and financial aid.'}
  ]}
 ];
 const draft={stages,goal:p.goal,target:p.target,approved:false,progress:{},completed:{}};
 stages.forEach((stage,i)=>stage.items.forEach((item,j)=>{
  const old=s.plan?.stages[i]?.items[j], id=i+'-'+j;
  if(old?.title===item.title&&old.body===item.body){
   if(s.plan.progress[id])draft.progress[id]=s.plan.progress[id];
   if(s.plan.completed?.[id])draft.completed[id]=true;
  }
 }));
 return draft;
}
function advise(intent,custom){
 const s=state(),{p,anchor,completed}=advisingContext(s);
 const work=anchor.title+(anchor.result?' — '+anchor.result:'');
 let answer='';
 s.pending=null;
 switch(intent){
  case 'project':
   answer='Let’s use '+work+' and your experience with '+p.activities+' to explore '+p.goal+'. Here are two ways to learn something different about what you enjoy. Both can start within your '+p.hours+' hours per week, using '+p.budget.toLowerCase()+'.';
   s.pending={type:'project',options:projectOptions(s)};
   break;
  case 'courses':
   answer='Here’s what you’ve logged: '+p.grades+'. With your interest in '+p.goal+', look at which next-year class gives you a chance to practice a skill you used in '+anchor.title+' while keeping your workload realistic. Ask your counselor: “'+p.school+'.” Bring your course options back here and add them to your profile.';
   break;
  case 'career':
   answer='You’re exploring '+p.goal+'. In '+work+', what would you choose to do again: make something, investigate a question, or explain it to someone? Compare your answer with what you enjoy in '+p.activities+'. Try two small projects with different kinds of work and record which part you wanted to keep doing.';
   s.pending={type:'project',options:projectOptions(s)};
   break;
  case 'college':
   answer=(p.target?'Use '+p.target+' as one starting point. ':'Start by comparing the kinds of programs you might enjoy. ')+'For '+p.goal+', pick one course and one project opportunity you’d genuinely want to try at each school. Then compare net price and location. Bring me two options and save your current shortlist in your profile. Check admissions details for your entry year on each school’s official website.';
   break;
  case 'plan':
   answer='Here’s a draft from where you are today: grade '+p.grade+', '+p.grades+', '+p.activities+', and up to '+p.hours+' hours a week. '+(completed?'I used the outcome you recorded for '+completed.title+'. ':'I used the work you’ve logged so far. ')+'Review it before saving it to your college plan.';
   const progress=Object.values(s.plan?.progress||{});
   if(progress.length)answer+=' Your previous plan includes this progress: “'+progress.at(-1)+'.” Check which next steps follow from it.';
   s.pending={type:'plan',plan:draftPlan(s)};
   break;
  default:
   answer='I can use your saved profile to walk through a course decision, a project, career exploration, college fit, or an admissions plan. Pick the topic closest to your question below.';
 }
 s.messages.push({from:'You',text:custom||questions[intent]},{from:'Mentor',text:answer});
}
function classify(text){
 if(/admission|application|roadmap|college plan/i.test(text))return 'plan';
 if(/project|prototype|portfolio|build.*make/i.test(text))return 'project';
 if(/course|class|grade|gpa|school subject/i.test(text))return 'courses';
 if(/career|job|major|profession/i.test(text))return 'career';
 if(/college|universit|campus|tuition/i.test(text))return 'college';
 return '';
}
function plansMarkup(plan,active=false){
 return plan.stages.map((stage,i)=>'<section class="line"><h3>'+stage.title+'</h3>'+stage.items.map((item,j)=>{
  const id=i+'-'+j, entry=plan.progress[id];
  return '<div class="card"><h3>'+safe(item.title)+'</h3><p>'+safe(item.body)+'</p>'+(active?
   '<form class="form" data-progress="'+id+'"><label for="note-'+id+'">Progress note</label><input id="note-'+id+'" name="note" maxlength="180" value="'+safe(entry)+'" placeholder="Add a result, decision or question"><div class="plan-check"><input id="complete-'+id+'" name="completed" type="checkbox" '+(plan.completed?.[id]?'checked':'')+'><label for="complete-'+id+'">I completed this step</label></div><div><button class="btn">Save progress</button></div></form>':'')+'</div>';
 }).join('')+'</section>').join('');
}
function tracker(plan,saved){
 const rows=plan.stages.map((stage,i)=>{
  const items=stage.items.map((item,j)=>{
   const id=i+'-'+j;
   return {title:item.title,done:!!plan.completed?.[id],started:!!plan.progress[id]?.trim()};
  });
  return {title:stage.title,items,done:items.filter(x=>x.done).length};
 });
 const items=rows.flatMap(row=>row.items);
 const done=items.filter(x=>x.done).length;
 const started=items.filter(x=>x.started&&!x.done).length;
 const next=items.find(x=>!x.done);
 return '<section class="card tracker plan-tracker"><h2>Where you stand</h2>'+
 (saved?'<p role="status"><strong>'+done+' of '+items.length+' steps complete</strong> · '+started+' in progress · '+(items.length-done-started)+' to start</p>':'<p class="muted">Preview of your plan stages. Save a plan to start tracking your progress.</p>')+
 rows.map(x=>'<div><div class="head"><strong>'+safe(x.title)+'</strong><span>'+(saved?x.done+' / '+x.items.length:'Preview')+'</span></div><progress class="meter" max="'+x.items.length+'" value="'+x.done+'" aria-label="'+safe(x.title)+'"></progress></div>').join('')+
 (saved?'<p class="muted">'+(next?'Next step: '+safe(next.title):'All steps in this version are complete.')+'</p>':'<div>'+button('ask-plan','Draft my college plan',true)+'</div>')+'</section>';
}
function conversation(messages){
 return '<div class="conversation" id="conversation" aria-live="polite">'+messages.map(m=>'<div class="bubble '+(m.from==='You'?'student':'')+'"><b>'+m.from+'</b><br>'+safe(m.text)+'</div>').join('')+'</div>';
}
function projectThreads(s){
 return '<div class="card"><h2>Project conversations</h2><p class="muted">Pick up where you left off.</p>'+s.projects.map((x,i)=>{
  const last=x.messages?.at(-1);
  return '<div class="project-row project-preview"><h3>'+safe(x.title)+'</h3><p class="muted">'+(last?safe(last.text.slice(0,100))+(last.text.length>100?'…':''):'Start a conversation about this project.')+'</p>'+button('thread-'+i,last?'Resume conversation':'Open conversation')+'</div>';
 }).join('')+button('go-My projects','Manage projects')+'</div>';
}
function proactive(s){
 const p=s.profile;
 const plan=s.plan;
 let title,details,action,label;
 const unfinished=plan?.stages.flatMap((stage,i)=>stage.items.map((item,j)=>({item,id:i+'-'+j}))).find(x=>!plan.completed?.[x.id]);
 if(s.dismissedAdvice===JSON.stringify([p.school,p.goal,unfinished?.id,s.projects.length,plan?.progress,plan?.completed]))return '';
 if(unfinished){
  title=unfinished.item.title;details=plan.progress[unfinished.id]?'You left this note: “'+plan.progress[unfinished.id]+'.” Revisit it when you have a decision or update.':unfinished.item.body;
  action='go-College plan';label='Open my plan';
 }else if(plan){
  title='Review your next semester';details='You’ve completed the steps in this version. Bring your latest coursework and project reflections into your next plan.';action='ask-plan';label='Review my plan';
 }else{
  title='Prepare for next year’s classes';details=p.school+'. Start with your current classes ('+p.grades+') and ask your counselor which options fit your interest in '+p.goal+'.';action='ask-courses';label='Talk through my classes';
 }
 return '<div class="card next-card"><h2>Suggested next step</h2><h3>'+safe(title)+'</h3><p>'+safe(details)+'</p><div class="actions">'+button(action,label,true)+button('snooze','Dismiss')+'</div></div>';
}
function projectReply(project,text,s){
 const p=s.profile,last=project.messages?.at(-1)?.text;
 const goal=project.detail||project.title;
 const prior=[...s.projects].reverse().find(x=>x!==project&&x.result);
 let answer;
 if(/stuck|trouble|hard|blocked|can.t|problem/i.test(text))answer='Let’s narrow it down. For '+project.title+', what is the smallest part you can try again with '+p.budget.toLowerCase()+'? Tell me where you got stuck so you can choose one change to test.';
 else if(/done|finished|made|tried|learned|feedback/i.test(text))answer='What changed after that attempt, and what would you do again? Save the part you learned in your project reflection so it can inform future advice about '+p.goal+'.';
 else if(project.result)answer='You have a reflection saved for this project. What is one step you could take based on what you learned?';
 else if(/\b(?:courses?|classes|prerequisites?)\b/i.test(goal))answer='List two courses you are considering. Compare their prerequisites, workload, and how each supports your goal. Which detail could you check in your school’s course catalog?';
 else if(/\bportfolio\b/i.test(goal))answer='Choose one piece of work you could finish a first version of this week. What skill will it show, and who could give you feedback?';
 else if(/\b(?:explore|interest|curious)\b/i.test(goal))answer='Pick one question about this interest. What small activity could you try this week to learn whether you enjoy it?';
 else answer='For '+project.title+', start with the smallest useful piece you can show someone within '+p.hours+' hours this week. '+(prior?'You recorded this in '+prior.title+': “'+prior.result+'.” Is there a technique from that project you can reuse here?':'What would you like someone to notice when they see a first version?');
 project.messages??=[];
 if(!last)project.messages.push({from:'Mentor',text:'Let’s talk about '+project.title+'. '+project.detail});
 project.messages.push({from:'You',text},{from:'Mentor',text:answer});
}
function pendingMarkup(s){
 if(!s.pending)return '';
 if(s.pending.type==='plan')return '<div class="card"><h2>Your draft admissions plan</h2>'+plansMarkup(s.pending.plan)+'<div class="actions">'+button('approve',s.plan?'Apply plan changes':'Save my admissions plan',true)+button('decline','Keep talking')+'</div></div>';
 return '<div class="card"><h2>Projects worth trying</h2>'+s.pending.options.map((x,i)=>'<div class="line"><h3>'+safe(x.title)+'</h3><p>'+safe(x.detail)+'</p>'+button('choose-'+i,'Try this project')+'</div>').join('')+'</div>';
}
function contextMarkup(s){
 const {p,anchor}=advisingContext(s);
 return '<div class="card"><h2>What I know about you</h2><div class="facts"><div><b>Exploring</b><br>'+safe(p.goal)+'</div><div><b>Classes and grades</b><br>'+safe(p.grades)+'</div><div><b>Outside class</b><br>'+safe(p.activities)+'</div><div><b>Project experience</b><br>'+safe(anchor.title)+(anchor.result?'<br>'+safe(anchor.result):'')+'</div><div><b>College interests</b><br>'+safe(p.target||'Still exploring')+'</div><div><b>Time and budget</b><br>'+safe(p.hours)+' hours/week · '+safe(p.budget)+'</div></div><div class="actions">'+button('go-My profile','Edit my context')+'</div></div>';
}
function render(){
 const s=state(),p=s.profile;
 $('persona').value=key;
 $('nav').innerHTML=routes.map(n=>'<button data-action="go-'+n+'" aria-current="'+(page===n)+'">'+n+'</button>').join('');
 const heading=(h,d)=>'<header class="sub"><h1>'+h+'</h1><p class="muted">'+d+'</p></header>';
 let html='';
 if(page==='Mentor'){
  const project=s.projects[activeProject];
  const view=project?
   '<div class="card"><div class="actions">'+button('mentor-home','Back to mentor')+'</div><h2>'+safe(project.title)+'</h2><p class="muted">'+safe(project.detail)+'</p>'+conversation(project.messages||[])+'<form id="project-chat" class="form"><label for="project-question">Continue this conversation</label><input id="project-question" name="question" maxlength="400" required placeholder="What did you try, or where are you stuck?"><div><button class="btn primary">Send</button></div></form><div class="actions">'+button('go-My projects','Save a project reflection')+'</div></div>':
   proactive(s)+'<div class="card"><h2>Ask your mentor</h2>'+conversation(s.messages)+'<div class="actions">'+Object.entries(questions).map(([id,label])=>button('ask-'+id,label)).join('')+'</div><form id="chat" class="form" style="margin-top:14px"><label for="question">Your question</label><input id="question" name="question" maxlength="400" required placeholder="What should I do if I like art and science?"><div><button class="btn primary">Ask mentor</button></div></form><p class="muted" style="margin:12px 0 0">Guided demo responses use your saved context.</p></div>'+pendingMarkup(s);
  html='<section class="hero"><div class="eyebrow">YOUR HIGH SCHOOL MENTOR · GRADE '+p.grade+'</div><h1>'+(project?'Project mentorship':'Hi, '+safe(p.name)+'.')+'</h1><p>'+(project?'Continue where you left off.':'Get guidance on classes, projects, careers and college planning.')+'</p></section><div class="mentor-layout"><div>'+view+'</div>'+projectThreads(s)+'</div>';
 }
 if(page==='My profile')html=heading('My profile','Add, review, or import entries that your mentor can use for advice.')+'<div class="grid"><div><div id="studio-profile-entries" class="profile-entries"></div><div class="actions">'+button('go-Mentor','Back to mentor')+'</div></div><div id="profile-context">'+contextMarkup(s)+'</div></div>';
 if(page==='My projects')html=heading('My projects','Work with your mentor on specific goals, like exploring an interest, choosing courses, or developing a portfolio project. Each project saves your conversation history and progress so you can pick up where you left off.')+'<div class="grid"><div>'+s.projects.map((x,i)=>'<div class="card"><h2>'+safe(x.title)+'</h2><p>'+safe(x.detail)+'</p><form class="form" data-project="'+i+'"><label for="result-'+i+'">What did you make or learn?</label><input id="result-'+i+'" name="result" maxlength="180" required value="'+safe(x.result)+'" placeholder="Add a result, feedback or something you discovered"><div><button class="btn">Save what I learned</button></div></form><div class="actions">'+button('thread-'+i,'Open project conversation')+'</div></div>').join('')+'</div><div><div class="card"><h2>Start a project</h2><form id="project" class="form">'+field('title','Project name','')+field('detail','What do you want to accomplish?','')+'<div><button class="btn primary">Create and open project</button></div></form></div><div class="card"><h2>Explore a new project</h2>'+button('ask-project','Ask my mentor')+'</div></div></div>';
 if(page==='College plan'){
  const plan=s.plan;
  html=heading('My college plan','Review your college preparation roadmap, track upcoming milestones, and approve changes as your goals evolve.')+(s.pending?.type==='plan'?pendingMarkup(s):'')+tracker(plan||draftPlan(s),!!plan)+'<div class="grid"><div><div class="card">'+(plan?'<div class="head"><h2>'+safe(plan.goal)+'</h2><span class="badge">Version '+(s.history.length+1)+'</span></div><p>'+(plan.target?safe(plan.target):'College interests still open')+'</p>'+plansMarkup(plan,true):'<h2>Start with a conversation</h2><p>Ask your mentor to draft a plan from your grades, activities, current interests and available time.</p>')+(plan?button('ask-plan','Review with my mentor',true):'')+'</div>'+(s.history.length?'<details class="card"><summary>Earlier plans and progress</summary>'+s.history.map(old=>'<div class="line"><b>'+safe(old.goal)+'</b><p>'+safe(Object.values(old.progress).join(' · ')||'No progress notes yet.')+'</p></div>').join('')+'</details>':'')+'</div><div><div class="card"><h2>Official college information</h2><p>Confirm requirements and deadlines for your entry year on each school’s official admissions site.</p>'+(p.target.includes('Stanford')?'<a class="btn" href="https://admission.stanford.edu/" target="_blank" rel="noopener">Stanford undergraduate admissions</a>':'')+'</div></div></div>';
 }
 $('view').innerHTML=(s.status?'<div role="status" class="notice">'+safe(s.status)+'</div>':'')+html;
 if(page==='My profile')studioProfile().mount($('studio-profile-entries'));
 if($('conversation'))$('conversation').scrollTop=$('conversation').scrollHeight;
}
document.addEventListener('click',e=>{
 const action=e.target.closest('[data-action]')?.dataset.action;
 if(!action)return;
 const s=state();s.status='';
 if(action.startsWith('go-')){page=action.slice(3);if(page==='Mentor')activeProject=null}
 else if(action.startsWith('thread-')){page='Mentor';activeProject=Number(action.slice(7))}
 else if(action==='mentor-home'){activeProject=null;page='Mentor'}
 else if(action==='snooze'){
  const unfinished=s.plan?.stages.flatMap((stage,i)=>stage.items.map((_,j)=>i+'-'+j)).find(id=>!s.plan.completed?.[id]);
  s.dismissedAdvice=JSON.stringify([s.profile.school,s.profile.goal,unfinished,s.projects.length,s.plan?.progress,s.plan?.completed]);
 }
 else if(action.startsWith('ask-')){page='Mentor';activeProject=null;advise(action.slice(4))}
 else if(action.startsWith('choose-')){
  const x=s.pending?.options?.[Number(action.slice(7))];
  if(x&&!s.projects.some(project=>project.title===x.title))s.projects.push({...x,result:''});
  s.pending=null;page='Mentor';activeProject=s.projects.findIndex(project=>project.title===x?.title);s.status='Project saved. Use this conversation to work through your next step.';
 }else if(action==='approve'&&s.pending?.plan){
  if(s.plan)s.history.unshift(s.plan);
  s.plan=s.pending.plan;s.plan.approved=true;s.pending=null;page='College plan';s.status='Your admissions plan is saved.';
 }else if(action==='decline')s.pending=null;
 save();render();
 if(action.startsWith('ask-')&&s.pending)document.querySelector('#conversation')?.scrollIntoView({block:'nearest'});
 else window.scrollTo(0,0);
});
document.addEventListener('submit',e=>{
 e.preventDefault();
 const s=state(),form=e.target,values=Object.fromEntries(Array.from(new FormData(form),([name,value])=>[name,value.trim()]));
 s.status='';
 if(form.id==='project-chat'&&values.question&&s.projects[activeProject])projectReply(s.projects[activeProject],values.question,s);
 else if(form.id==='chat'&&values.question)advise(classify(values.question),values.question);
 else if(form.id==='project'&&values.title&&values.detail){s.projects.push({...values,result:'',kind:'custom'});s.pending=null;activeProject=s.projects.length-1;page='Mentor';s.status='Project created. Ask your mentor about your first step.'}
 else if(form.dataset.project!==undefined&&values.result){s.projects[Number(form.dataset.project)].result=values.result;s.pending=null;s.status='Saved. Your mentor can use this in future advice.'}
 else if(form.dataset.progress){const id=form.dataset.progress;s.plan.progress[id]=values.note;s.plan.completed??={};s.plan.completed[id]=values.completed==='on';s.status='Progress saved.'}
 save();render();
});
$('persona').addEventListener('change',e=>{key=e.target.value;page='Mentor';activeProject=null;render();studioProfile();window.scrollTo(0,0)});
render();
studioProfile();
</script></body></html>
